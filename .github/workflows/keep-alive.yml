name: Keep Backend Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging backend..."
          curl -sf https://attendance-management-system-1-txzw.onrender.com/api/health
          echo "Backend is alive!"